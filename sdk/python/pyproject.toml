[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-sdk"
version = "1.0.0"
description = "Official Python SDK for the RAVEN distributed jobs platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RAVEN" }]
keywords = ["raven", "jobs", "task-queue", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/refleeexzz/RAVEN"
Documentation = "https://github.com/refleeexzz/RAVEN/tree/main/docs/sdks.md"

[tool.setuptools.packages.find]
include = ["raven*"]
