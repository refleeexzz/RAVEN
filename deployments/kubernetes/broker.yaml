# RAVEN broker — StatefulSet because it owns on-disk commit logs:
# stable identity + its own PVC, exactly one replica (no clustering yet).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  namespace: raven
  labels:
    app: broker
    app.kubernetes.io/part-of: raven
spec:
  serviceName: broker
  replicas: 1
  selector:
    matchLabels:
      app: broker
  volumeClaimTemplates:
    - metadata:
        name: brokerdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        app: broker
    spec:
      # No RAVEN pod calls the k8s API: dedicated SA, token not mounted.
      serviceAccountName: raven
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # uid baked into every raven/* image
        runAsGroup: 10001
        # fsGroup makes the brokerdata PVC group-writable for uid 10001,
        # so the commit logs stay writable with a read-only root fs.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: raven/broker:latest
          imagePullPolicy: IfNotPresent   # local build, never pushed
          securityContext:
            allowPrivilegeEscalation: false
            # /data (the PVC mount) stays writable; the rest is read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tcp
              containerPort: 9100
            - name: ops
              containerPort: 9101
          env:
            - name: BROKER_TCP_ADDR
              value: ":9100"
            - name: HTTP_ADDR
              value: ":9101"
            # /data is the PVC mount below — commit logs survive restarts.
            - name: BROKER_DATA_DIR
              value: /data
            # New topics get 12 partitions: consumer-group parallelism is
            # capped by partition count, and 3 was the drain bottleneck we
            # measured in the 2026-09 load test (16 msg/s with 3 active
            # consumers out of 8 members).
            - name: BROKER_DEFAULT_PARTITIONS
              value: "12"
          envFrom:
            - configMapRef:
                name: raven-config
          readinessProbe:
            httpGet:
              path: /ready
              port: ops
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ops
            initialDelaySeconds: 10
            periodSeconds: 15
          # Bigger slice than the other services: the broker does disk I/O
          # and fsync on the hot path.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: brokerdata
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: raven
  labels:
    app: broker
    app.kubernetes.io/part-of: raven
spec:
  type: ClusterIP
  selector:
    app: broker
  ports:
    - name: tcp
      port: 9100
      targetPort: tcp
    - name: ops
      port: 9101
      targetPort: ops
