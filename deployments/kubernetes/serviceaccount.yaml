# Dedicated ServiceAccount for every RAVEN pod.
#
# No RAVEN service (or its third-party sidekicks: postgres, redis,
# prometheus, grafana, jaeger) ever calls the Kubernetes API, so the
# account needs ZERO Roles/Bindings and the API token is not mounted
# into the pods at all. If a pod is ever compromised, there is no
# token to steal and no API permission to abuse.
#
# RBAC for this account: intentionally EMPTY. Do not add a RoleBinding
# unless a service genuinely starts talking to the API server — and if
# that day comes, scope it to the minimum verbs/resources needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raven
  namespace: raven
  labels:
    app.kubernetes.io/part-of: raven
automountServiceAccountToken: false
