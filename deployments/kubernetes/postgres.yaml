# Postgres for local k8s dev. One replica with a PVC — good enough for a
# laptop, not for anything real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: raven
  labels:
    app: postgres
    app.kubernetes.io/part-of: raven
spec:
  replicas: 1
  # Recreate (not RollingUpdate): a second pod would attach the same RWO
  # volume and deadlock the rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # postgres keeps its OWN user: the alpine image's entrypoint and the
      # initialized data dir on the PVC both expect uid 70, not 10001.
      # Started directly as 70, the entrypoint skips its root-only chown
      # path and never needs a single capability.
      serviceAccountName: raven
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70   # keeps the PVC + scratch dirs group-writable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            # PGDATA + the two scratch dirs below stay writable; the rest
            # of the image is read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          env:
            # Dev-only credentials — they match the DATABASE_URL in the
            # secrets template. Never reuse outside Docker Desktop.
            - name: POSTGRES_USER
              value: raven
            - name: POSTGRES_PASSWORD
              value: raven
            - name: POSTGRES_DB
              value: raven
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "raven", "-d", "raven"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "raven", "-d", "raven"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # postgres creates its unix socket + lock files here; with a
            # read-only root fs this dir must be a writable mount.
            - name: pg-run
              mountPath: /run/postgresql
            - name: pg-tmp
              mountPath: /tmp
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
        - name: pg-run
          emptyDir: {}
        - name: pg-tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: raven
  labels:
    app.kubernetes.io/part-of: raven
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: raven
  labels:
    app: postgres
    app.kubernetes.io/part-of: raven
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
