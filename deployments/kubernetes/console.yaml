# RAVEN Console — the operations dashboard, served by nginx as static files.
# LoadBalancer on 7100: whenever the cluster is up, the console is up.
# The browser calls the gateway (localhost:8080) and websocket (:8084)
# directly — those URLs are build-time defaults, not cluster DNS, because
# the client runs on YOUR machine, not inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: raven
  labels:
    app: console
    app.kubernetes.io/part-of: raven
spec:
  replicas: 2
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      # No RAVEN pod calls the k8s API: dedicated SA, token not mounted.
      serviceAccountName: raven
      automountServiceAccountToken: false
      securityContext:
        # The unprivileged nginx image runs as uid 101 and listens on
        # 8080 — no root, no capabilities needed to serve static files.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Pinned tag, not :latest — Docker Desktop's k8s keeps a cached
          # copy of a tag once resolved (IfNotPresent), so a moved :latest
          # keeps serving the STALE image. Bump the tag on every console
          # rebuild. This tag names the unprivileged-nginx build (uid 101).
          image: raven/console:unpriv-nginx-20260914
          imagePullPolicy: IfNotPresent   # local build, never pushed
          securityContext:
            allowPrivilegeEscalation: false
            # nginx needs three writable scratch dirs; they are emptyDir
            # mounts below, so the root fs stays read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: raven
  labels:
    app: console
    app.kubernetes.io/part-of: raven
spec:
  type: LoadBalancer   # Docker Desktop binds this to localhost:7100
  selector:
    app: console
  ports:
    - name: http
      port: 7100
      targetPort: http
