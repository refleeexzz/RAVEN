# RAVEN Console — the operations dashboard, served by nginx as static files.
# LoadBalancer on 7100: whenever the cluster is up, the console is up.
# The browser calls the gateway (localhost:8080) and websocket (:8084)
# directly — those URLs are build-time defaults, not cluster DNS, because
# the client runs on YOUR machine, not inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: raven
  labels:
    app: console
    app.kubernetes.io/part-of: raven
spec:
  replicas: 2
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      containers:
        - name: console
          image: raven/console:latest
          imagePullPolicy: IfNotPresent   # local build, never pushed
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: raven
  labels:
    app: console
    app.kubernetes.io/part-of: raven
spec:
  type: LoadBalancer   # Docker Desktop binds this to localhost:7100
  selector:
    app: console
  ports:
    - name: http
      port: 7100
      targetPort: http
