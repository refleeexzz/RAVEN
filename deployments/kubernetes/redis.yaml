# Redis for local k8s dev: worker registry + job events pub/sub.
# Stateless here (no PVC) — losing the registry on restart is harmless
# because workers re-register within seconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: raven
  labels:
    app: redis
    app.kubernetes.io/part-of: raven
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # The redis alpine image's own user is uid 999 (group 1000). Running
      # as it directly makes the entrypoint skip its root-only su-exec
      # path — the process never touches root at all.
      serviceAccountName: raven
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8-alpine
          securityContext:
            allowPrivilegeEscalation: false
            # /data (workdir for dump.rdb) is an emptyDir below; the rest
            # of the image is read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: raven
  labels:
    app: redis
    app.kubernetes.io/part-of: raven
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
