# !!! TEMPLATE ONLY — NEVER commit real secrets !!!
#
# Copy this file OUTSIDE the repo (or to secrets.yaml, which must stay
# gitignored), fill in real base64 values, then apply:
#
#   printf 'your-secret' | base64        # encode each value
#   kubectl apply -f secrets.yaml
#
# The placeholders below are the documented DEV defaults, base64-encoded.
# They are fine for Docker Desktop and match the code fallbacks, so a
# fresh clone works even if you skip this file.
apiVersion: v1
kind: Secret
metadata:
  name: raven-secrets
  namespace: raven
  labels:
    app.kubernetes.io/part-of: raven
type: Opaque
data:
  # base64 of "dev-only-secret-change-me" — dev default, change for anything real
  JWT_SECRET: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZQ==
  # JWT_SECRET_PREVIOUS is set ONLY during a rotation window: verification
  # accepts it as a fallback while signing always uses JWT_SECRET, so live
  # tokens survive the swap. Do not leave it set permanently — add it when
  # you start a rotation, remove it once
  # raven_auth_jwt_previous_secret_used_total sits at ~0 for 15+ min.
  # Full procedure: docs/security/rotation.md (or scripts/rotate-jwt-secret.sh).
  # JWT_SECRET_PREVIOUS: PGJhY2U2NC1vZi10aGUtb2xkLXZhbHVlPg==
  # base64 of "postgres://raven:raven@postgres:5432/raven?sslmode=disable"
  DATABASE_URL: cG9zdGdyZXM6Ly9yYXZlbjpyYXZlbkBwb3N0Z3Jlczo1NDMyL3JhdmVuP3NzbG1vZGU9ZGlzYWJsZQ==
