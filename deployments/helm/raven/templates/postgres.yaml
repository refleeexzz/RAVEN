{{- if .Values.postgres.enabled -}}
# Postgres for the platform. One replica with a PVC — good enough for dev
# and small setups. For real HA, run an external database and disable this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  # Recreate (not RollingUpdate): a second pod would attach the same RWO
  # volume and deadlock the rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raven.labels" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      # postgres keeps its OWN user: the alpine image's entrypoint and the
      # initialized data dir on the PVC both expect uid 70.
      serviceAccountName: {{ include "raven.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "raven.image" (dict "ctx" . "image" .Values.postgres.image) }}
          imagePullPolicy: {{ include "raven.imagePullPolicy" (dict "ctx" . "image" .Values.postgres.image) }}
          securityContext:
            {{- include "raven.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
          env:
            # PGDATA points INTO a subdirectory of the PVC mount: initdb
            # needs to chmod its data dir, and it cannot chmod the PVC
            # mountpoint itself (owned by root). The flat manifests hit
            # this on fresh clusters; the chart bakes the fix in.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.db | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.db | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            # postgres creates its unix socket + lock files here; with a
            # read-only root fs this dir must be a writable mount.
            - name: pg-run
              mountPath: /run/postgresql
            - name: pg-tmp
              mountPath: /tmp
      volumes:
        - name: pgdata
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: pgdata
          {{- else }}
          # persistence.enabled=false: dev-only volatile mode.
          emptyDir: {}
          {{- end }}
        - name: pg-run
          emptyDir: {}
        - name: pg-tmp
          emptyDir: {}
---
{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    {{- include "raven.selectorLabels" "postgres" | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.service.port }}
{{- end }}
