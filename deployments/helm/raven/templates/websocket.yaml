{{- if .Values.websocket.enabled -}}
# RAVEN websocket — reached from outside only through the gateway's /ws
# proxy (and directly by the console browser in dev). Subscribes to Redis
# raven:events:jobs and fans events out to connected clients.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "websocket") | nindent 4 }}
spec:
  replicas: {{ .Values.websocket.replicas }}
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" "websocket" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raven.labels" (dict "ctx" . "component" "websocket") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "raven.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "raven.podSecurityContext" . | nindent 8 }}
      containers:
        - name: websocket
          image: {{ include "raven.image" (dict "ctx" . "image" .Values.websocket.image) }}
          imagePullPolicy: {{ include "raven.imagePullPolicy" (dict "ctx" . "image" .Values.websocket.image) }}
          securityContext:
            {{- include "raven.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.websocket.service.httpPort }}
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.websocket.service.httpPort }}"
          envFrom:
            - configMapRef:
                name: raven-config
            - secretRef:
                name: {{ .Values.secrets.name }}
                optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.websocket.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: websocket
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "websocket") | nindent 4 }}
spec:
  type: {{ .Values.websocket.service.type }}
  selector:
    {{- include "raven.selectorLabels" "websocket" | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.websocket.service.httpPort }}
      targetPort: http
{{- end }}
