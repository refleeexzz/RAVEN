{{- if .Values.console.enabled -}}
# RAVEN Console — the operations dashboard, served by nginx as static
# files. The browser calls the gateway and websocket directly (those URLs
# are build-time defaults on the client, not cluster DNS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "console") | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" "console" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raven.labels" (dict "ctx" . "component" "console") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "raven.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        # The unprivileged nginx image runs as uid 101 and listens on 8080.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "raven.image" (dict "ctx" . "image" .Values.console.image) }}
          imagePullPolicy: {{ include "raven.imagePullPolicy" (dict "ctx" . "image" .Values.console.image) }}
          securityContext:
            {{- include "raven.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            # nginx needs three writable scratch dirs; root fs stays read-only.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "console") | nindent 4 }}
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "raven.selectorLabels" "console" | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.service.httpPort }}
      targetPort: http
{{- end }}
