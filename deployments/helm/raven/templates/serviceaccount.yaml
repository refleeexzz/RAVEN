{{- if .Values.serviceAccount.create -}}
# Dedicated ServiceAccount for every RAVEN pod. RBAC intentionally EMPTY:
# no RAVEN service calls the k8s API, so there is no token to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raven.serviceAccountName" . }}
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "serviceaccount") | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
