{{- if .Values.secrets.create -}}
# Rendered from values. For anything real, inject the values with --set or
# a gitignored -f file — never commit them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecretPrevious }}
  # Rotation window only — remove once the old secret is drained.
  JWT_SECRET_PREVIOUS: {{ .Values.secrets.jwtSecretPrevious | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
{{- end }}
