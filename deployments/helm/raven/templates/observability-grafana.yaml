{{- if and .Values.observability.enabled .Values.observability.grafana.enabled -}}
# Grafana provisioning: datasources + dashboard provider.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:{{ .Values.observability.prometheus.service.port }}
        isDefault: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:{{ .Values.observability.jaeger.service.uiPort }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: raven
        orgId: 1
        folder: RAVEN
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
# The RAVEN dashboards, shipped from files/dashboards/ inside the chart.
# Source of truth: deployments/grafana/dashboards/ — refresh the copies
# with: cp deployments/grafana/dashboards/*.json deployments/helm/raven/files/dashboards/
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-raven
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $content | toString | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" "grafana" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raven.labels" (dict "ctx" . "component" "grafana") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "raven.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        # The grafana image's own user is uid 472.
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ include "raven.image" (dict "ctx" . "image" .Values.observability.grafana.image) }}
          imagePullPolicy: {{ include "raven.imagePullPolicy" (dict "ctx" . "image" .Values.observability.grafana.image) }}
          securityContext:
            {{- include "raven.containerSecurityContext" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.observability.grafana.service.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.observability.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.observability.grafana.adminPassword | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.observability.grafana.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.observability.grafana.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources/datasources.yaml
              - key: dashboards.yaml
                path: dashboards/dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboard-raven
        - name: grafana-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
spec:
  # DEV: LoadBalancer binds the UI to localhost. In production put it
  # behind an authenticated Ingress and change the admin login.
  type: {{ .Values.observability.grafana.service.type }}
  selector:
    {{- include "raven.selectorLabels" "grafana" | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.observability.grafana.service.port }}
      targetPort: {{ .Values.observability.grafana.service.port }}
{{- end }}
