{{- if .Values.users.enabled -}}
# RAVEN users — gRPC for other services, ops HTTP for health/metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "users") | nindent 4 }}
spec:
  replicas: {{ .Values.users.replicas }}
  selector:
    matchLabels:
      {{- include "raven.selectorLabels" "users" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raven.labels" (dict "ctx" . "component" "users") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "raven.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "raven.podSecurityContext" . | nindent 8 }}
      containers:
        - name: users
          image: {{ include "raven.image" (dict "ctx" . "image" .Values.users.image) }}
          imagePullPolicy: {{ include "raven.imagePullPolicy" (dict "ctx" . "image" .Values.users.image) }}
          securityContext:
            {{- include "raven.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: ops
              containerPort: {{ .Values.users.service.opsPort }}
            - name: grpc
              containerPort: {{ .Values.users.service.grpcPort }}
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.users.service.opsPort }}"
            - name: GRPC_ADDR
              value: ":{{ .Values.users.service.grpcPort }}"
          envFrom:
            - configMapRef:
                name: raven-config
            - secretRef:
                name: {{ .Values.secrets.name }}
                optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: ops
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: ops
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.users.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: {{ include "raven.namespace" . }}
  labels:
    {{- include "raven.labels" (dict "ctx" . "component" "users") | nindent 4 }}
spec:
  type: {{ .Values.users.service.type }}
  selector:
    {{- include "raven.selectorLabels" "users" | nindent 4 }}
  ports:
    - name: ops
      port: {{ .Values.users.service.opsPort }}
      targetPort: ops
    - name: grpc
      port: {{ .Values.users.service.grpcPort }}
      targetPort: grpc
{{- end }}
