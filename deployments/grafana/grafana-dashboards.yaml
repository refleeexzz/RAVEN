# Production dashboards ConfigMap — companion to the dev stack in
# deployments/kubernetes/observability.yaml (which is generated by
# deployments/gen-observability-k8s.py and only embeds raven-platform.json).
#
# Apply:
#   kubectl apply -f deployments/grafana/grafana-dashboards.yaml
# then mount it in the grafana Deployment next to the existing
# `dashboards` volume (same mountPath /etc/grafana/dashboards is fine —
# use a second volume with a different name, e.g. dashboards-prod):
#
#   volumes:
#     - name: dashboards-prod
#       configMap:
#         name: grafana-dashboards-production
#
# and add a matching volumeMount (mountPath /etc/grafana/dashboards-prod)
# plus a second provider entry in grafana-provisioning/dashboards.yaml
# pointing at that path. The compose stack needs no manifest: it mounts
# the whole deployments/grafana/dashboards directory and picks these up
# automatically.
---
# grafana-dashboards-production: embedded from deployments/grafana/dashboards/ — edit the
# JSON files, then regenerate or apply with:
#   kubectl -n raven create configmap grafana-dashboards-production \
#     --from-file=deployments/grafana/dashboards \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-production
  namespace: raven
  labels:
    app.kubernetes.io/part-of: raven
data:
  raven-broker-overview.json: |
    {
      "title": "RAVEN Broker Overview",
      "uid": "raven-broker-overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "",
      "tags": [
        "raven",
        "broker"
      ],
      "description": "Custom TCP broker: throughput, lag, storage/retention and auth security.",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Prometheus",
            "query": "prometheus",
            "regex": "",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Produce throughput",
          "datasource": {
            "type": "datasource",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(raven_broker_messages_produced_total[1m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Consume throughput",
          "datasource": {
            "type": "datasource",
            "uid": "${datasource}"
          },
          "description": "Alias series of messages_fetched_total; both are exported.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(raven_broker_messages_consumed_total[1m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total consumer lag",
          "datasource": {
            "type": "datasource",
            "uid": "${datasource}"
          },
          "description": "SLO threshold: 10k messages per group/partition.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(raven_broker_consumer_lag)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 10000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "id": 4,
