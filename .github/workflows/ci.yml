# RAVEN CI — every push and PR to main must pass all three jobs.
#
#   build        lint + vet + race-enabled tests + vuln scan + compile
#   docker       prove every service image builds (matrix, no push)
#   integration  testcontainers-based integration tests
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.27"

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true   # module cache keyed on go.sum — huge time saver

      - name: gofmt
        # Fail the build on ANY unformatted file and print the offenders.
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: go build (compile everything)
        run: go build ./...

  docker:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one broken Dockerfile must not hide the others
      matrix:
        service:
          - gateway
          - auth
          - users
          - jobs
          - websocket
          - broker
          - worker
          - migrate
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        # Build only — CI proves the Dockerfiles compile a static binary;
        # images are built locally for Docker Desktop k8s, never pushed.
        run: docker build -f deployments/docker/Dockerfile.${{ matrix.service }} -t raven/${{ matrix.service }}:ci .

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test (integration)
        # testcontainers spins its own postgres/redis containers — the
        # only requirement is a Docker daemon, which GHA runners have.
        run: go test -tags=integration ./tests/integration/... -timeout 10m
