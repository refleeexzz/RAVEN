server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted bundles are safe to cache hard.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
