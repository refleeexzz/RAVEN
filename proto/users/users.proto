syntax = "proto3";

package raven.users.v1;

import "common/common.proto";

option go_package = "github.com/refleeexzz/RAVEN/internal/gen/users";

// UserService manages user profiles: CRUD, pagination, filters,
// soft delete. Credentials themselves stay in the auth service.
service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_url = 5;
  bool deleted = 6;
  int64 created_at = 7; // unix seconds
  int64 updated_at = 8; // unix seconds
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  raven.common.v1.PageRequest page = 1;
  string email_filter = 2;   // substring, case-insensitive
  bool include_deleted = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  raven.common.v1.PageResponse page = 2;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
}

message UpdateUserRequest {
  string id = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool ok = 1;
}
